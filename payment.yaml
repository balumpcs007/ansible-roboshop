- name: set up pyamnet configuration
  hosts: payment
  become: yes
  tasks:
  - name: install python packages
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - python3
    - gcc
    - python3-devel
  - name: setup system user
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      shell: /sbin/nologin
      system: true
      home: /app
  - name: remove app directory
    ansible.builtin.file:
      path: /app
      state: absent
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  - name: remove application
    ansible.builtin.file:
      path: /tmp/payment.zip
      state: absent
  - name: download application
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
      dest: /tmp/payment.zip
  - name: unarchive the application
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes
  - name: download dependencies
    ansible.builtin.pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app
  - name: copy the payment.service file
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service
  - name: enabled daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  - name: restart and enable payment service
    ansible.builtin.service:
      name: payment.service
      state: restarted
