- name: user configuration
  hosts: user
  become: yes
  tasks:
  - name: disable nodejs
    ansible.builtin.command:
      cmd: dnf module disable nodejs -y
  - name: enable nodejs
    ansible.builtin.command:
      cmd: dnf module enable nodejs:20 -y
  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present
  - name: create system user
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      shell: /sbin/nologin
      system: true
      home: /app
  - name: remove app directory
    ansible.builtin.file:
      path: /app
      state: absent
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  - name: remove appliaction
    ansible.builtin.file:
      path: /tmp/user.zip
      state: absent
  - name: downloading user application
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
      dest: /tmp/user.zip
  - name: unarchive user application
    ansible.builtin.unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: copy the user.service file
    ansible.builtin.copy:
      src: user.service
      dest: /etc/systemd/system/user.service
  - name: daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  - name: restart and enable user service
    ansible.builtin.service:
      name: user
      state: restarted
      enabled: yes
  - name: restart and enable user service
    ansible.builtin.service:
      name: user
      state: restarted